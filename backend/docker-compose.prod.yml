services:
  # Production deployment - HTTP only (SSL termination handled by reverse proxy)
  zradminwebapi:
    image: ${DOCKER_REGISTRY-}zradminwebapi
    build:
      context: .
      dockerfile: ZR.Admin.WebApi/Dockerfile
    container_name: maham_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Force IPv4 for Supabase connection
      - DOTNET_SYSTEM_NET_DISABLEIPV6=true
    ports:
      - "8080:8080"
    networks:
      - maham_network
    extra_hosts:
      # Add explicit IPv4 mapping for Supabase host
      - "db.ctlaeyiulnukpoxuztla.supabase.co:34.82.126.136"
    volumes:
      - zradminwebapi_data:/app/wwwroot
      - zradminwebapi_uploads:/app/secure-uploads
    restart: unless-stopped

  # Local PostgreSQL for development (configured for remote access)
  postgres:
    image: postgres:15-alpine
    container_name: maham_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: MahamDB
      # Allow connections from any host
      POSTGRES_HOST_AUTH_METHOD: "md5"
    ports:
      - "0.0.0.0:5433:5432"  # Bind to all interfaces, using 5433 to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: 
      - "postgres"
      - "-c"
      - "listen_addresses=*"  # Listen on all interfaces
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "log_connections=on"
    networks:
      - maham_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  zradminwebapi_data:
  zradminwebapi_uploads:

networks:
  maham_network:
    driver: bridge
