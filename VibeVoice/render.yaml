# Render Blueprint — VibeVoice on the FREE plan, mirroring VibeVoice/docker-compose.yml:
#
#   docker-compose.yml        Render (this file)                       Built from
#   ------------------        ------------------                       ----------
#   api                   ->  vibevoice-api            (Docker)        VibeVoice/backend/Dockerfile
#   voice-service         ->  vibevoice-voice-service  (Docker)        VibeVoice/voice-service/Dockerfile
#   frontend              ->  vibevoice-frontend       (static site)   VibeVoice/frontend (npm run build)
#   postgres (profile)    ->  Neon Postgres (outside Render, free)     paste its URL once
#
# Render ▸ New ▸ Blueprint ▸ this repo ▸ branch feature/vibevoice-notes-memories ▸
#   Blueprint path: VibeVoice/render.yaml        Full walkthrough: VibeVoice/DEPLOY.md
#
# Why it differs from compose:
#  - Render runs one container per service and can't read a compose file, so each compose service is
#    listed here. Free services can't talk over Render's private network, so they use public https URLs.
#  - Disks are wiped on every restart/sleep, so data AND uploaded files live in Postgres
#    (Storage__Provider=Database) instead of the compose volumes.
#  - 512 MB RAM and no GPU: Whisper "base" instead of "small" (LOW_MEMORY swaps it with the OCR models), and speech uses the Edge neural voices
#    (Arabic + English) instead of the VibeVoice model. Uploads are capped (5/10/25 MB).
#  - Services sleep after ~15 min idle; the first request wakes them (~30-60 s). The static site never sleeps.
#
# URLs below assume Render gives each service its plain name (https://<name>.onrender.com). If a name is
# taken, Render adds a suffix: then fix Cors__Origins__0, VoiceService__BaseUrl and VITE_API_URL to the real URLs.

services:
  # ---------------- api (.NET) ----------------
  - type: web
    name: vibevoice-api
    runtime: docker
    plan: free
    region: ohio            # same AWS area as the Neon database (us-east-2)
    branch: feature/vibevoice-notes-memories
    dockerfilePath: ./VibeVoice/backend/Dockerfile
    dockerContext: ./VibeVoice/backend
    healthCheckPath: /health
    buildFilter:
      paths: ["VibeVoice/backend/**"]
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render's proxy sits in front: use X-Forwarded-For so rate limits see real client IPs.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: Database__Provider
        value: PostgreSQL
      # Neon connection string, pasted exactly as Neon shows it (postgresql://...?sslmode=require...).
      - key: Database__ConnectionString
        sync: false
      # Never seed the demo account (known password) on a public URL.
      - key: Database__Seed
        value: "false"
      - key: Storage__Provider
        value: Database
      - key: Uploads__MaxImageBytes
        value: "5242880"      # 5 MB
      - key: Uploads__MaxAudioBytes
        value: "10485760"     # 10 MB
      - key: Uploads__MaxVideoBytes
        value: "26214400"     # 25 MB
      - key: Uploads__MaxRequestBytes
        value: "31457280"     # 30 MB
      - key: Jwt__Key
        generateValue: true
      # YOUR email: only this address becomes Admin when it registers.
      - key: Auth__BootstrapAdminEmail
        sync: false
      # compose: Cors__Origins__0 = the frontend's address
      - key: Cors__Origins__0
        value: https://vibevoice-frontend.onrender.com
      # compose: VoiceService__BaseUrl = http://voice-service:8001
      - key: VoiceService__BaseUrl
        value: https://vibevoice-voice-service.onrender.com
      - key: VoiceService__ApiKey
        fromService:
          type: web
          name: vibevoice-voice-service
          envVarKey: API_KEY
      # A sleeping voice service needs time to wake up.
      - key: VoiceService__HealthTimeoutSeconds
        value: "5"
      # Free plan = 0.1 CPU: Whisper takes ~8x the recording's length (a 5-min recording ~40 min).
      # Let one call and one background job run that long instead of failing.
      - key: VoiceService__RequestTimeoutSeconds
        value: "5400"     # 90 min
      - key: Jobs__TimeoutMinutes
        value: "95"

  # ---------------- voice-service (Python: TTS / transcription / OCR) ----------------
  - type: web
    name: vibevoice-voice-service
    runtime: docker
    plan: free
    region: ohio
    branch: feature/vibevoice-notes-memories
    dockerfilePath: ./VibeVoice/voice-service/Dockerfile
    dockerContext: ./VibeVoice/voice-service
    healthCheckPath: /health
    buildFilter:
      paths: ["VibeVoice/voice-service/**"]
    envVars:
      # Shared secret; the API reads it via fromService above. Everything except /health requires it.
      - key: API_KEY
        generateValue: true
      - key: TTS_ENGINE
        value: edge
      - key: ARABIC_TTS_ENGINE
        value: edge
      - key: FALLBACK_TTS_ENGINE
        value: dev
      - key: ASR_ENGINE
        value: whisper
      # "base": tiny garbles Arabic; small is better but needs ~800 MB. Baked into the image at build.
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_CPU_THREADS
        value: "1"
      # Greedy decoding: same text on clear speech, less memory (peak ~340 MB instead of ~430 MB).
      - key: WHISPER_BEAM_SIZE
        value: "1"
      # The model is baked into the image; don't ask Hugging Face for updates on every load.
      # Remove this if you change WHISPER_MODEL to a model that isn't in the image.
      - key: HF_HUB_OFFLINE
        value: "1"
      # 512 MB: keep only one of Whisper / OCR in memory at a time (measured peak ~430 MB).
      - key: LOW_MEMORY
        value: "true"
      - key: OCR_ENGINE
        value: rapidocr
      - key: MAX_UPLOAD_MB
        value: "30"
      - key: LOG_FORMAT
        value: json

  # ---------------- frontend (React, served as a static site instead of compose's nginx) ----------------
  - type: web
    name: vibevoice-frontend
    runtime: static
    branch: feature/vibevoice-notes-memories
    rootDir: VibeVoice/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths: ["VibeVoice/frontend/**"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      # compose: VITE_API_URL build arg. Baked in at build time — redeploy the site after changing it.
      - key: VITE_API_URL
        value: https://vibevoice-api.onrender.com
      - key: VITE_MAX_IMAGE_MB
        value: "5"
      - key: VITE_MAX_AUDIO_MB
        value: "10"
      - key: VITE_MAX_VIDEO_MB
        value: "25"
    routes:
      # Single-page app: every path that isn't a file goes to index.html (React Router handles it).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=()
