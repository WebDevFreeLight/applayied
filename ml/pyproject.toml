[project]
name = "pmo-ml"
version = "1.0.0"
description = "Machine-learning service for the PMO Portal: task delay, risk severity, spend forecast, cost anomalies, portfolio segments."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
pmo-ml = "pmo_ml.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
